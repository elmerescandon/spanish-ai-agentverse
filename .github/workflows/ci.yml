name: CI

on:
  push:
  pull_request:

# A newer push to the same ref makes older runs (and their deploys) stale.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml
      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Check formatting (ruff format)
        run: uv run ruff format --check .

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy backend

      # -m overrides pyproject's default filter, so CI also runs the slow
      # `extended` tests (real demo PDFs); only live API tests are skipped.
      - name: Run tests (pytest incl. extended, live tests skipped)
        run: uv run pytest -m 'not live'

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        run: bun install --cwd frontend --frozen-lockfile

      - name: Lint frontend (eslint)
        run: bun run --cwd frontend lint

      - name: Type-check frontend (tsc)
        run: bun run --cwd frontend typecheck

      - name: Run frontend tests (bun test)
        run: bun run --cwd frontend test

      - name: Build frontend (next build)
        run: bun run --cwd frontend build

  deploy:
    name: Deploy to Vercel
    needs: check
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    # Deploys take ~30s; the Vercel CLI sometimes never exits, so fail fast.
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Skip deploy if VERCEL_TOKEN missing
        if: env.VERCEL_TOKEN == ''
        run: echo "VERCEL_TOKEN secret is not set; skipping deployment."

      - name: Install Vercel CLI
        if: env.VERCEL_TOKEN != ''
        run: npm install --global vercel@65.12.1

      - name: Pull Vercel Environment (Production)
        if: env.VERCEL_TOKEN != '' && github.ref == 'refs/heads/main'
        run: >-
          vercel pull --yes --environment=production
          --token="${VERCEL_TOKEN}"

      - name: Deploy to Vercel Production
        if: env.VERCEL_TOKEN != '' && github.ref == 'refs/heads/main'
        run: vercel deploy --prod --yes --token="${VERCEL_TOKEN}"

      - name: Pull Vercel Environment (Preview)
        if: env.VERCEL_TOKEN != '' && github.ref != 'refs/heads/main'
        run: >-
          vercel pull --yes --environment=preview
          --token="${VERCEL_TOKEN}"

      - name: Deploy to Vercel Preview
        if: env.VERCEL_TOKEN != '' && github.ref != 'refs/heads/main'
        run: vercel deploy --yes --token="${VERCEL_TOKEN}"
