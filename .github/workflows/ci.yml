name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, type-check and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # --locked fails if uv.lock is out of date with pyproject.toml, instead of silently re-resolving
      - name: Install Python and dependencies
        run: uv sync --locked

      - name: Check formatting (ruff format)
        run: uv run ruff format --check .

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Type-check (mypy)
        run: uv run mypy backend

      # -m overrides pyproject's default filter, so CI also runs the slow
      # `extended` tests (real demo PDFs); only live API tests are skipped.
      - name: Run tests (pytest incl. extended, live tests skipped)
        run: uv run pytest -m 'not live'
