source = "FDA final guidance: Enhancing Participation in Clinical Trials: Eligibility Criteria, Enrollment Practices, and Trial Designs (Dec 2025)"
source_tier = "final_guidance"

# ---------------------------------------------------------------------------
# Family EX: Eligibility exclusion library for adult T2D (EX-01 to EX-50)
# CORE fires when absent; CLASS fires when absent and the drug class
# matches; BREADTH fires when present without a stated reason (ELQ-11).
# ---------------------------------------------------------------------------

[[rule]]
id = "EX-01"
family = "EX"
severity = "S2"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Not excluded: non-type 2 diabetes (T1D, LADA, other)"
flag_if = "No eligibility criterion excludes non-type 2 diabetes (T1D, LADA, other)."
fix = "Exclude non-type 2 diabetes by history, with GAD antibodies when in doubt."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"
library_tag = "CORE"

[[rule]]
id = "EX-02"
family = "EX"
severity = "S2"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D", "CONTROL_IS_PLACEBO"]
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Not excluded: HbA1c above a ceiling for placebo exposure"
flag_if = "No eligibility criterion excludes HbA1c above a ceiling for placebo exposure."
fix = "Exclude HbA1c above about 10.5 to 11.0% at screening when placebo is given."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"
library_tag = "CORE"

[[rule]]
id = "EX-03"
family = "EX"
severity = "S2"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Not excluded: recent DKA or hyperosmolar state"
flag_if = "No eligibility criterion excludes recent DKA or hyperosmolar state."
fix = "Exclude DKA or hyperosmolar hyperglycaemic state within the last 6 months."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"
library_tag = "CORE"

[[rule]]
id = "EX-04"
family = "EX"
severity = "S2"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Not excluded: severe hypoglycaemia or unawareness"
