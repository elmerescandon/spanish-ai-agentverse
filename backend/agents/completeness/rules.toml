check = "deterministic"
title = "Cardiovascular risk factors not scheduled"
flag_if = "Lipids, body weight, waist circumference, blood pressure or heart rate are missing from the schedule of activities."
fix = "Add each cardiovascular risk factor to the schedule of activities."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-40"
family = "DM"
severity = "S2"
detection = ["F"]
applies_when = ["DIABETES_TYPE_T2D", "INTERVENTION_IS_DRUG"]
needs_inputs = []
sections = ["ASSESSMENTS_AND_PROCEDURES"]
check = "deterministic"
title = "Microvascular safety not scheduled"
flag_if = "Retinopathy (eye examination) or nephropathy (urine albumin-to-creatinine ratio) is not assessed in the schedule of activities."
fix = "Schedule eye examinations and UACR measurements."
source = "FDA draft guidance (non-binding): Type 2 Diabetes Mellitus: Evaluating the Safety of New Drugs (March 2020)"
source_tier = "draft_guidance"

[[rule]]
id = "DM-41"
