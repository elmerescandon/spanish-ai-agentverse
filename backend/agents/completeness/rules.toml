check = "judgement"
title = "No anti-drug antibody plan for a peptide"
flag_if = "A protein or peptide drug has no plan to measure anti-drug antibody incidence and titres over time."
fix = "Add immunogenicity sampling and analysis."
source = "FDA draft guidance (non-binding): Type 2 Diabetes Mellitus: Evaluating the Safety of New Drugs (March 2020)"
source_tier = "draft_guidance"

[[rule]]
id = "DM-39"
family = "DM"
severity = "S2"
