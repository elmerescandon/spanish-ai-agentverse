fix = "Demote CGM time-in-range to a secondary endpoint and use HbA1c change from baseline as primary."
source = "FDA draft guidance (non-binding): Diabetes Mellitus: Efficacy Endpoints (May 2023)"
source_tier = "draft_guidance"

[[rule]]
id = "DM-11"
family = "DM"
severity = "S1"
detection = ["X"]
applies_when = ["DIABETES_TYPE_T2D", "CONTROL_IS_PLACEBO"]
needs_inputs = []
sections = ["TRIAL_POPULATION", "TRIAL_INTERVENTION"]
check = "judgement"
title = "Placebo monotherapy >3 months in advanced or high-HbA1c T2D"
flag_if = "Triggered when a placebo monotherapy arm lasts > 3 months; fires if eligibility permits participants beyond early-stage disease or with high baseline HbA1c."
fix = "Limit placebo monotherapy duration to <= 3 months or restrict eligibility to early-stage T2D with moderate baseline HbA1c."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-12"
family = "DM"
severity = "S1"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D", "CONTROL_IS_PLACEBO"]
needs_inputs = []
sections = ["TRIAL_DESIGN", "TRIAL_INTERVENTION"]
check = "judgement"
title = "Placebo control exposure exceeds 6 months unadjusted"
flag_if = "Participants in a placebo arm remain on placebo for > 6 months without justification or transition to active treatment."
fix = "Cap placebo exposure at 6 months (26 weeks) or switch placebo participants to active comparator thereafter."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-13"
family = "DM"
severity = "S1"
detection = ["F"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["TRIAL_INTERVENTION"]
check = "deterministic"
title = "Pre-defined glycaemic rescue algorithm is missing"
flag_if = "Section 6 lacks a pre-specified glycaemic rescue algorithm defining period-specific FPG/HbA1c thresholds, confirmatory testing, and rescue agents."
fix = "Add a tiered glycaemic rescue algorithm specifying FPG/HbA1c trigger thresholds by study period, retest confirmation, and permitted rescue therapy."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-14"
family = "DM"
severity = "S1"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D", "CONTROL_IS_ACTIVE", "INTERVENTION_IS_DRUG"]
needs_inputs = []
sections = ["TRIAL_INTERVENTION"]
check = "judgement"
title = "Active-control trial lacks symmetric titration algorithms"
flag_if = "Triggered when investigational or active-comparator drugs are titratable; fires if the protocol omits a treat-to-target titration algorithm with equivalent glycaemic targets in both arms."
fix = "Specify symmetric treat-to-target dose-titration algorithms and matching glycaemic targets for both treatment arms."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-15"
family = "DM"
severity = "S1"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D", "IS_NON_INFERIORITY"]
needs_inputs = []
sections = ["STATISTICAL_CONSIDERATIONS"]
check = "judgement"
title = "HbA1c non-inferiority margin exceeds 0.3% (3 mmol/mol)"
flag_if = "The non-inferiority margin for HbA1c is wider than 0.3% (3 mmol/mol) or is stated without clinical/statistical justification."
fix = "Set the HbA1c non-inferiority upper confidence bound margin to 0.3% (3 mmol/mol) with supporting rationale."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-17"
family = "DM"
severity = "S1"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D", "IS_ADD_ON"]
needs_inputs = []
sections = ["TRIAL_POPULATION", "TRIAL_INTERVENTION"]
check = "deterministic"
title = "Add-on trial lacks 8-12 week stable background therapy"
flag_if = "An add-on diabetes trial does not require stable background glucose-lowering therapy at a constant dose for at least 8–12 weeks before randomisation."
fix = "Require participants to maintain stable background antidiabetic therapy for 8–12 weeks prior to randomisation."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-20"
family = "DM"
severity = "S1"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D", "DRUG_CLASS_IS_INSULIN"]
needs_inputs = []
sections = ["TRIAL_DESIGN", "TRIAL_INTERVENTION"]
check = "judgement"
title = "Insulin trial assigns insulin-dependent patients to placebo"
flag_if = "Triggered when the trial enrols insulin-dependent participants; fires if a placebo comparator arm is used instead of an active insulin control."
fix = "Replace the placebo arm with an active insulin comparator for insulin-dependent participants."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-21"
family = "DM"
severity = "S1"
detection = ["F"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["OBJECTIVES_AND_ESTIMANDS"]
check = "deterministic"
title = "Diabetes estimand omits rescue, discontinuation, or add-on"
flag_if = "The primary estimand fails to list all three core diabetes intercurrent events: initiation of glycaemic rescue therapy, treatment discontinuation, and changes to background antidiabetic medication."
fix = "Add intercurrent-event rows and strategies for rescue medication, treatment discontinuation, and background-therapy modification."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-23"
family = "DM"
severity = "S1"
detection = ["X"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["OBJECTIVES_AND_ESTIMANDS", "DISCONTINUATION", "ASSESSMENTS_AND_PROCEDURES"]
check = "deterministic"
title = "HbA1c data not collected after treatment discontinuation"
flag_if = "Participants who stop study medication early do not continue scheduled HbA1c assessments through the primary endpoint visit."
fix = "Require continued HbA1c collection at scheduled visits after treatment discontinuation to support the estimand analysis."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-28"
family = "DM"
severity = "S1"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["ASSESSMENTS_AND_PROCEDURES"]
check = "deterministic"
title = "Hypoglycaemia not classified by ADA/IHSG Level 1-3 cut-offs"
flag_if = "Hypoglycaemia assessments do not define the three standard ADA/IHSG tiers: Level 1 (< 70 and >= 54 mg/dL), Level 2 (< 54 mg/dL), and Level 3 (severe event requiring external assistance)."
fix = "Define hypoglycaemia using the ADA/IHSG classification: Level 1 (< 70 and >= 54 mg/dL), Level 2 (< 54 mg/dL), and Level 3 (requiring third-party assistance)."
source = "FDA draft guidance (non-binding): Diabetes Mellitus: Efficacy Endpoints (May 2023)"
source_tier = "draft_guidance"

[[rule]]
id = "DM-32"
family = "DM"
severity = "S1"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["OBJECTIVES_AND_ESTIMANDS", "STATISTICAL_CONSIDERATIONS"]
check = "judgement"
title = "Hypoglycaemia-reduction claim lacks HbA1c non-inferiority"
flag_if = "Triggered when the protocol plans a superiority claim on hypoglycaemia reduction; fires if it does not require demonstrating comparable HbA1c control (non-inferiority upper bound <= 0.3% and point estimate <= 0.1%)."
fix = "Gate the hypoglycaemia-reduction claim on demonstrating HbA1c non-inferiority with an upper confidence bound <= 0.3% and point estimate <= 0.1%."
source = "FDA draft guidance (non-binding): Diabetes Mellitus: Efficacy Endpoints (May 2023)"
source_tier = "draft_guidance"

[[rule]]
id = "DM-43"
family = "DM"
severity = "S1"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T1D"]
needs_inputs = []
sections = ["TRIAL_DESIGN", "TRIAL_INTERVENTION"]
check = "judgement"
title = "T1D non-insulin adjunct lacks run-in, 26w primary, or 6m ext"
flag_if = "Triggered when evaluating a non-insulin adjunct in Type 1 diabetes; fires if the design omits an insulin-optimisation run-in, an approximately 26-week primary endpoint, or a 6-month extension."
fix = "Include a pre-randomisation insulin-optimisation run-in, a 26-week primary efficacy timepoint, and a 6-month safety extension."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-45"
family = "DM"
severity = "S1"
detection = ["F"]
applies_when = ["DIABETES_TYPE_T1D"]
needs_inputs = []
sections = ["TRIAL_INTERVENTION", "ASSESSMENTS_AND_PROCEDURES"]
check = "deterministic"
title = "Type 1 diabetes protocol omits DKA ketone monitoring"
flag_if = "A Type 1 diabetes protocol lacks diabetic ketoacidosis (DKA) monitoring and mitigation procedures (blood/urine ketone testing and sick-day management rules)."
fix = "Add blood ketone monitoring thresholds, sick-day insulin/hydration rules, and DKA evaluation triggers."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

# ---------------------------------------------------------------------------
# Family ELQ: Eligibility-criteria quality (ELQ-01 to ELQ-23)
# ---------------------------------------------------------------------------

[[rule]]
id = "ELQ-01"
family = "ELQ"
severity = "S1"
detection = ["P"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "deterministic"
title = "Criterion not answerable yes/no"
flag_if = "A criterion relies on a vague term such as 'poorly controlled', 'significant' or 'clinically relevant' with no threshold or named diagnosis."
fix = "Replace the vague term with a numeric threshold or a named diagnosis."
source = "ICH M11 Template, Step 4"
source_tier = "ich"

[[rule]]
id = "ELQ-02"
family = "ELQ"
severity = "S1"
detection = ["P"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Lab criterion lacks value, unit or laboratory"
flag_if = "A laboratory-based criterion does not give the cut-off value, its unit, or whether the central or local laboratory result applies."
fix = "State the value, the unit and which laboratory's result is used."
source = "ICH M11 Template, Step 4"
source_tier = "ich"

[[rule]]
id = "ELQ-03"
family = "ELQ"
severity = "S2"
detection = ["P"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "deterministic"
title = "History criterion has no look-back window"
flag_if = "A 'history of' criterion does not say how far back it looks (for example within 6 months, or ever)."
fix = "Add the look-back window to each history criterion."
source = "ICH M11 Template, Step 4"
source_tier = "ich"

[[rule]]
id = "ELQ-04"
family = "ELQ"
severity = "S2"
detection = ["P"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Accepted prior result has no maximum age"
flag_if = "A criterion accepts an existing result (such as a recent eye exam) without saying how old that result may be."
fix = "State the maximum age of an accepted result, for example within 90 days."
source = "ICH M11 Template, Step 4"
source_tier = "ich"

[[rule]]
id = "ELQ-05"
family = "ELQ"
severity = "S2"
detection = ["P"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Criterion does not say when it is assessed"
flag_if = "A criterion does not say whether it is checked at screening, at randomisation or at the end of run-in."
fix = "State the timepoint at which each criterion is assessed."
source = "ICH M11 Template, Step 4"
source_tier = "ich"

[[rule]]
id = "ELQ-06"
family = "ELQ"
severity = "S2"
detection = ["P"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Two or more conditions fused in one criterion"
flag_if = "A single criterion joins two or more independent conditions that a site would have to check separately."
fix = "Split the criterion so each one states a single condition."
source = "ICH M11 Template, Step 4"
source_tier = "ich"

[[rule]]
id = "ELQ-07"
family = "ELQ"
severity = "S3"
detection = ["X"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Inclusion and exclusion mirror each other"
flag_if = "An exclusion criterion simply restates an inclusion criterion in the negative (or the reverse)."
fix = "Keep the rule once, in whichever list reads most naturally."
source = "ICH M11 Template, Step 4"
source_tier = "ich"

[[rule]]
id = "ELQ-08"
family = "ELQ"
severity = "S3"
detection = ["P"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Investigator-discretion criterion with no examples"
flag_if = "A criterion is wholly left to investigator opinion ('any condition that in the investigator's opinion...') without examples."
fix = "Keep the catch-all but add concrete examples of what it covers."
source = "ICH M11 Template, Step 4"
source_tier = "ich"

[[rule]]
id = "ELQ-09"
family = "ELQ"
severity = "S3"
detection = ["P"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "deterministic"
title = "HbA1c or eGFR units incomplete"
flag_if = "HbA1c is given in % without mmol/mol, or an eGFR limit does not name the estimating equation (such as CKD-EPI 2021)."
fix = "Give HbA1c in both % and mmol/mol and name the eGFR equation."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "ELQ-10"
family = "ELQ"
severity = "S1"
detection = ["X"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION", "ASSESSMENTS_AND_PROCEDURES"]
check = "judgement"
title = "Criterion needs a test missing from screening"
flag_if = "A criterion depends on a test or measurement that does not appear at the screening visit of the schedule of activities."
fix = "Add the test to the screening column of the schedule of activities."
source = "ICH M11 Template, Step 4"
source_tier = "ich"

[[rule]]
id = "ELQ-11"
family = "ELQ"
severity = "S2"
detection = ["J"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION", "INTRODUCTION"]
check = "judgement"
title = "Exclusion has no stated reason"
flag_if = "An exclusion criterion has no safety or scientific reason that can be traced to the investigator's brochure, the drug's mechanism or a trial objective."
fix = "State the reason for the exclusion, or remove it."
source = "FDA final guidance: Enhancing Participation in Clinical Trials: Eligibility Criteria, Enrollment Practices, and Trial Designs (Dec 2025)"
source_tier = "final_guidance"

[[rule]]
id = "ELQ-12"
family = "ELQ"
severity = "S2"
detection = ["P"]
applies_when = ["IS_PHASE_3"]
needs_inputs = []
sections = ["PROTOCOL_SUMMARY", "TRIAL_POPULATION"]
check = "judgement"
title = "Upper age limit in a phase 3 trial"
flag_if = "A phase 3 trial sets a maximum age (for example 65 or 75 years) without a stated safety reason."
fix = "Remove the upper age limit or state the safety reason for it."
source = "FDA final guidance: Enhancing Participation in Clinical Trials: Eligibility Criteria, Enrollment Practices, and Trial Designs (Dec 2025)"
source_tier = "final_guidance"

[[rule]]
id = "ELQ-13"
family = "ELQ"
severity = "S2"
detection = ["P"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Blanket organ exclusion instead of a graded cut-off"
flag_if = "An exclusion names a whole organ disease ('renal disease', 'hepatic disease') instead of a graded measure such as an eGFR band, Child-Pugh class or ALT multiple of ULN."
fix = "Replace the blanket exclusion with a graded cut-off."
source = "FDA final guidance: Enhancing Participation in Clinical Trials: Eligibility Criteria, Enrollment Practices, and Trial Designs (Dec 2025)"
source_tier = "final_guidance"

[[rule]]
id = "ELQ-14"
family = "ELQ"
severity = "S2"
detection = ["J"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Blanket comorbidity exclusion"
flag_if = "An exclusion removes everyone with a condition (cardiovascular disease, HIV, any cancer history) where only a specific sub-state carries the risk."
fix = "Narrow it to the risky sub-state, for example NYHA class IV or MI within 90 days."
source = "FDA final guidance: Enhancing Participation in Clinical Trials: Eligibility Criteria, Enrollment Practices, and Trial Designs (Dec 2025)"
source_tier = "final_guidance"

[[rule]]
id = "ELQ-15"
family = "ELQ"
severity = "S2"
detection = ["C"]
applies_when = []
needs_inputs = ["comparator_corpus"]
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Exclusion carried over despite new safety data"
flag_if = "An exclusion is copied unchanged from an earlier-phase protocol of the same drug although newer safety data no longer support it."
fix = "Broaden the criterion and cite the newer safety data."
source = "Comparison with prior protocols of the same drug"
source_tier = "comparator_norm"

[[rule]]
id = "ELQ-16"
family = "ELQ"
severity = "S2"
detection = ["J"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Stable common comorbidities excluded"
flag_if = "People with stable, treated conditions that are common in type 2 diabetes (hypertension, dyslipidaemia, controlled hypothyroidism) are excluded."
fix = "Allow these conditions when they have been stable on treatment for a set period."
source = "FDA final guidance: Enhancing Participation in Clinical Trials: Eligibility Criteria, Enrollment Practices, and Trial Designs (Dec 2025)"
source_tier = "final_guidance"

[[rule]]
id = "ELQ-17"
family = "ELQ"
severity = "S3"
detection = ["P"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "deterministic"
title = "Language requirement with no translation plan"
flag_if = "Participants who are not fluent in the local language are excluded and no translated materials or interpreters are planned."
fix = "Plan translated materials or interpreters instead of excluding on language."
source = "FDA final guidance: Enhancing Participation in Clinical Trials: Eligibility Criteria, Enrollment Practices, and Trial Designs (Dec 2025)"
source_tier = "final_guidance"

[[rule]]
id = "ELQ-18"
family = "ELQ"
severity = "S2"
detection = ["J"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Women of childbearing potential fully excluded"
flag_if = "Women of childbearing potential are excluded outright when a contraception requirement would manage the risk."
fix = "Replace the exclusion with a contraception requirement."
source = "FDA final guidance: Enhancing Participation in Clinical Trials: Eligibility Criteria, Enrollment Practices, and Trial Designs (Dec 2025)"
source_tier = "final_guidance"

[[rule]]
id = "ELQ-19"
family = "ELQ"
severity = "S2"
detection = ["J"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "BMI ceiling without a pharmacokinetic reason"
flag_if = "A BMI upper limit (for example below 35 kg/m²) removes a large share of the type 2 diabetes population with no pharmacokinetic reason given."
fix = "Raise or remove the BMI ceiling, or state the reason for it."
source = "FDA final guidance: Enhancing Participation in Clinical Trials: Eligibility Criteria, Enrollment Practices, and Trial Designs (Dec 2025)"
source_tier = "final_guidance"

[[rule]]
id = "ELQ-20"
family = "ELQ"
severity = "S2"
detection = ["J", "C"]
applies_when = ["IS_PHASE_3"]
needs_inputs = []
sections = ["TRIAL_POPULATION", "INTRODUCTION"]
check = "judgement"
title = "Eligibility narrower than the label population"
flag_if = "Phase 3 eligibility is tighter than the population expected to use the drug, with no plan to study the excluded groups elsewhere."
fix = "Plan a sub-study for the excluded groups or justify the narrower population."
source = "FDA final guidance: Enhancing Participation in Clinical Trials: Eligibility Criteria, Enrollment Practices, and Trial Designs (Dec 2025)"
source_tier = "final_guidance"

[[rule]]
id = "ELQ-21"
family = "ELQ"
severity = "S3"
detection = ["P"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "deterministic"
title = "More than 25 exclusion criteria"
flag_if = "The protocol lists more than about 25 exclusion criteria."
fix = "Consolidate overlapping exclusions."
source = "Eligibility complexity heuristic (screen failure and amendment risk)"
source_tier = "heuristic"

[[rule]]
id = "ELQ-22"
family = "ELQ"
severity = "S3"
detection = ["J"]
applies_when = []
needs_inputs = []
sections = ["ASSESSMENTS_AND_PROCEDURES", "TRIAL_DESIGN"]
check = "judgement"
title = "No remote options for frequent or fasting visits"
flag_if = "The trial has frequent or fasting visits and does not consider remote or decentralised options."
fix = "Note which visits or procedures could be done remotely."
source = "FDA final guidance: Enhancing Participation in Clinical Trials: Eligibility Criteria, Enrollment Practices, and Trial Designs (Dec 2025)"
source_tier = "final_guidance"

[[rule]]
id = "ELQ-23"
family = "ELQ"
severity = "S3"
detection = ["J"]
applies_when = []
needs_inputs = []
sections = ["TRIAL_POPULATION", "TRIAL_DESIGN"]
check = "judgement"
title = "No recruitment plan for the intended population"
flag_if = "The protocol does not describe recruitment or site selection that reaches the people likely to use the drug."
fix = "Add a recruitment and site-selection note covering the intended population."
source = "FDA final guidance: Enhancing Participation in Clinical Trials: Eligibility Criteria, Enrollment Practices, and Trial Designs (Dec 2025)"
source_tier = "final_guidance"
