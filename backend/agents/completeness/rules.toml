flag_if = "Liver enzymes are not monitored with rules that separate a drug effect from diabetes-related fluctuation."
fix = "Add Hy's law based liver monitoring and follow-up rules."
source = "FDA draft guidance (non-binding): Type 2 Diabetes Mellitus: Evaluating the Safety of New Drugs (March 2020)"
source_tier = "draft_guidance"

[[rule]]
