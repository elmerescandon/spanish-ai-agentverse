fix = "Add MACE adjudication or justify why it is not needed."
source = "EMA reflection paper EMA/CHMP/50549/2015 and EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-36"
family = "DM"
severity = "S2"
detection = ["F"]
applies_when = ["DIABETES_TYPE_T2D", "INTERVENTION_IS_DRUG"]
needs_inputs = []
sections = ["ASSESSMENTS_AND_PROCEDURES"]
check = "judgement"
