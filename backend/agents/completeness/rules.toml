fix = "Exclude people unable to use a glucose meter or CGM, self-inject or keep a diary after training."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"
library_tag = "CORE"

[[rule]]
id = "EX-48"
family = "EX"
severity = "S2"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D", "DRUG_CLASS_IS_INSULIN"]
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Not excluded: shift work or irregular meals"
flag_if = "No eligibility criterion excludes shift work or irregular meals."
fix = "Exclude night-shift work or irregular meals in prandial insulin or hypoglycaemia studies."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"
