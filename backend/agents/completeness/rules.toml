needs_inputs = []
sections = ["OBJECTIVES_AND_ESTIMANDS", "ASSESSMENTS_AND_PROCEDURES"]
check = "judgement"
title = "No validated diabetes-specific PRO"
flag_if = "A confirmatory trial has no validated diabetes-specific patient-reported outcome."
fix = "Add a validated diabetes PRO, such as a treatment-satisfaction questionnaire."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
