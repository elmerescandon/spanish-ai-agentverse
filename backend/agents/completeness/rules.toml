[[rule]]
id = "EX-49"
family = "EX"
severity = "S2"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["TRIAL_POPULATION"]
check = "judgement"
title = "Not excluded: site or sponsor staff and their families"
flag_if = "No eligibility criterion excludes site or sponsor staff and their families."
fix = "Exclude site staff, sponsor staff and their family members."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
