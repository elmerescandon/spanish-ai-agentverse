# ---------------------------------------------------------------------------
# Family DM: Diabetes S1 blockers (16 rules)
# ---------------------------------------------------------------------------

[[rule]]
id = "DM-01"
family = "DM"
severity = "S1"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["OBJECTIVES_AND_ESTIMANDS"]
check = "judgement"
title = "Primary endpoint is not change from baseline in HbA1c"
flag_if = "Triggered when the trial targets a glycaemic-control claim; fires if the primary efficacy endpoint is not change from baseline in HbA1c."
fix = "Designate change from baseline in HbA1c as the primary efficacy endpoint."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-02"
family = "DM"
severity = "S1"
detection = ["P", "J"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["OBJECTIVES_AND_ESTIMANDS", "TRIAL_DESIGN"]
check = "judgement"
title = "Primary HbA1c timepoint shorter than 6 months (Week 26)"
flag_if = "The primary efficacy assessment occurs before 6 months (Week 26) of randomised treatment without an explicit scientific justification."
fix = "Set the primary HbA1c evaluation at Week 26 (6 months) or justify the shorter treatment duration."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-06"
family = "DM"
severity = "S1"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["OBJECTIVES_AND_ESTIMANDS"]
check = "deterministic"
title = "CGM time-in-range used as primary glycaemic endpoint"
flag_if = "Continuous glucose monitoring (CGM) time-in-range is designated as the primary efficacy endpoint for a glycaemic-control trial."
fix = "Demote CGM time-in-range to a secondary endpoint and use HbA1c change from baseline as primary."
source = "FDA draft guidance (non-binding): Diabetes Mellitus: Efficacy Endpoints (May 2023)"
source_tier = "draft_guidance"

[[rule]]
id = "DM-11"
family = "DM"
severity = "S1"
detection = ["X"]
applies_when = ["DIABETES_TYPE_T2D", "CONTROL_IS_PLACEBO"]
needs_inputs = []
sections = ["TRIAL_POPULATION", "TRIAL_INTERVENTION"]
check = "judgement"
title = "Placebo monotherapy >3 months in advanced or high-HbA1c T2D"
flag_if = "Triggered when a placebo monotherapy arm lasts > 3 months; fires if eligibility permits participants beyond early-stage disease or with high baseline HbA1c."
fix = "Limit placebo monotherapy duration to <= 3 months or restrict eligibility to early-stage T2D with moderate baseline HbA1c."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-12"
family = "DM"
severity = "S1"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D", "CONTROL_IS_PLACEBO"]
needs_inputs = []
sections = ["TRIAL_DESIGN", "TRIAL_INTERVENTION"]
check = "judgement"
title = "Placebo control exposure exceeds 6 months unadjusted"
flag_if = "Participants in a placebo arm remain on placebo for > 6 months without justification or transition to active treatment."
fix = "Cap placebo exposure at 6 months (26 weeks) or switch placebo participants to active comparator thereafter."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-13"
family = "DM"
severity = "S1"
detection = ["F"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["TRIAL_INTERVENTION"]
check = "deterministic"
title = "Pre-defined glycaemic rescue algorithm is missing"
flag_if = "Section 6 lacks a pre-specified glycaemic rescue algorithm defining period-specific FPG/HbA1c thresholds, confirmatory testing, and rescue agents."
fix = "Add a tiered glycaemic rescue algorithm specifying FPG/HbA1c trigger thresholds by study period, retest confirmation, and permitted rescue therapy."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-14"
family = "DM"
severity = "S1"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D", "CONTROL_IS_ACTIVE", "INTERVENTION_IS_DRUG"]
needs_inputs = []
sections = ["TRIAL_INTERVENTION"]
check = "judgement"
title = "Active-control trial lacks symmetric titration algorithms"
flag_if = "Triggered when investigational or active-comparator drugs are titratable; fires if the protocol omits a treat-to-target titration algorithm with equivalent glycaemic targets in both arms."
fix = "Specify symmetric treat-to-target dose-titration algorithms and matching glycaemic targets for both treatment arms."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-15"
family = "DM"
severity = "S1"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D", "IS_NON_INFERIORITY"]
needs_inputs = []
sections = ["STATISTICAL_CONSIDERATIONS"]
check = "judgement"
title = "HbA1c non-inferiority margin exceeds 0.3% (3 mmol/mol)"
flag_if = "The non-inferiority margin for HbA1c is wider than 0.3% (3 mmol/mol) or is stated without clinical/statistical justification."
fix = "Set the HbA1c non-inferiority upper confidence bound margin to 0.3% (3 mmol/mol) with supporting rationale."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-17"
family = "DM"
severity = "S1"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D", "IS_ADD_ON"]
needs_inputs = []
sections = ["TRIAL_POPULATION", "TRIAL_INTERVENTION"]
check = "deterministic"
title = "Add-on trial lacks 8-12 week stable background therapy"
flag_if = "An add-on diabetes trial does not require stable background glucose-lowering therapy at a constant dose for at least 8–12 weeks before randomisation."
fix = "Require participants to maintain stable background antidiabetic therapy for 8–12 weeks prior to randomisation."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-20"
family = "DM"
severity = "S1"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D", "DRUG_CLASS_IS_INSULIN"]
needs_inputs = []
sections = ["TRIAL_DESIGN", "TRIAL_INTERVENTION"]
check = "judgement"
title = "Insulin trial assigns insulin-dependent patients to placebo"
flag_if = "Triggered when the trial enrols insulin-dependent participants; fires if a placebo comparator arm is used instead of an active insulin control."
fix = "Replace the placebo arm with an active insulin comparator for insulin-dependent participants."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-21"
family = "DM"
severity = "S1"
detection = ["F"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["OBJECTIVES_AND_ESTIMANDS"]
check = "deterministic"
title = "Diabetes estimand omits rescue, discontinuation, or add-on"
flag_if = "The primary estimand fails to list all three core diabetes intercurrent events: initiation of glycaemic rescue therapy, treatment discontinuation, and changes to background antidiabetic medication."
fix = "Add intercurrent-event rows and strategies for rescue medication, treatment discontinuation, and background-therapy modification."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-23"
family = "DM"
severity = "S1"
detection = ["X"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["OBJECTIVES_AND_ESTIMANDS", "DISCONTINUATION", "ASSESSMENTS_AND_PROCEDURES"]
check = "deterministic"
title = "HbA1c data not collected after treatment discontinuation"
flag_if = "Participants who stop study medication early do not continue scheduled HbA1c assessments through the primary endpoint visit."
fix = "Require continued HbA1c collection at scheduled visits after treatment discontinuation to support the estimand analysis."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-28"
family = "DM"
severity = "S1"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["ASSESSMENTS_AND_PROCEDURES"]
check = "deterministic"
title = "Hypoglycaemia not classified by ADA/IHSG Level 1-3 cut-offs"
flag_if = "Hypoglycaemia assessments do not define the three standard ADA/IHSG tiers: Level 1 (< 70 and >= 54 mg/dL), Level 2 (< 54 mg/dL), and Level 3 (severe event requiring external assistance)."
fix = "Define hypoglycaemia using the ADA/IHSG classification: Level 1 (< 70 and >= 54 mg/dL), Level 2 (< 54 mg/dL), and Level 3 (requiring third-party assistance)."
source = "FDA draft guidance (non-binding): Diabetes Mellitus: Efficacy Endpoints (May 2023)"
source_tier = "draft_guidance"

[[rule]]
id = "DM-32"
family = "DM"
severity = "S1"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["OBJECTIVES_AND_ESTIMANDS", "STATISTICAL_CONSIDERATIONS"]
check = "judgement"
title = "Hypoglycaemia-reduction claim lacks HbA1c non-inferiority"
flag_if = "Triggered when the protocol plans a superiority claim on hypoglycaemia reduction; fires if it does not require demonstrating comparable HbA1c control (non-inferiority upper bound <= 0.3% and point estimate <= 0.1%)."
fix = "Gate the hypoglycaemia-reduction claim on demonstrating HbA1c non-inferiority with an upper confidence bound <= 0.3% and point estimate <= 0.1%."
source = "FDA draft guidance (non-binding): Diabetes Mellitus: Efficacy Endpoints (May 2023)"
source_tier = "draft_guidance"

[[rule]]
id = "DM-43"
family = "DM"
severity = "S1"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T1D"]
needs_inputs = []
sections = ["TRIAL_DESIGN", "TRIAL_INTERVENTION"]
check = "judgement"
title = "T1D non-insulin adjunct lacks run-in, 26w primary, or 6m ext"
flag_if = "Triggered when evaluating a non-insulin adjunct in Type 1 diabetes; fires if the design omits an insulin-optimisation run-in, an approximately 26-week primary endpoint, or a 6-month extension."
fix = "Include a pre-randomisation insulin-optimisation run-in, a 26-week primary efficacy timepoint, and a 6-month safety extension."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-45"
family = "DM"
severity = "S1"
detection = ["F"]
applies_when = ["DIABETES_TYPE_T1D"]
needs_inputs = []
sections = ["TRIAL_INTERVENTION", "ASSESSMENTS_AND_PROCEDURES"]
check = "deterministic"
title = "Type 1 diabetes protocol omits DKA ketone monitoring"
flag_if = "A Type 1 diabetes protocol lacks diabetic ketoacidosis (DKA) monitoring and mitigation procedures (blood/urine ketone testing and sick-day management rules)."
fix = "Add blood ketone monitoring thresholds, sick-day insulin/hydration rules, and DKA evaluation triggers."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"


[[rule]]
id = "DM-03"
family = "DM"
severity = "S2"
detection = ["X"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["ASSESSMENTS_AND_PROCEDURES", "TRIAL_INTERVENTION"]
check = "judgement"
title = "HbA1c read before 12 weeks of stable dosing"
flag_if = "The HbA1c used for efficacy is measured before participants have had about 12 weeks on a stable dose."
fix = "Move the efficacy HbA1c assessment to at least 12 weeks after the final dose step."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-04"
family = "DM"
severity = "S2"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["ASSESSMENTS_AND_PROCEDURES"]
check = "deterministic"
title = "HbA1c not from a central certified assay"
flag_if = "HbA1c is not analysed by a central laboratory using an NGSP-certified (or IFCC-traceable) method."
fix = "Name the central laboratory and its NGSP or IFCC certification."
source = "FDA draft guidance (non-binding): Diabetes Mellitus: Efficacy Endpoints (May 2023)"
source_tier = "draft_guidance"

[[rule]]
id = "DM-05"
family = "DM"
severity = "S2"
detection = ["J", "C"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["TRIAL_DESIGN", "INTRODUCTION"]
check = "judgement"
title = "No 12-month durability data planned"
flag_if = "Neither this trial nor the wider programme it cites provides glycaemic data over at least 12 months."
fix = "Add a 12-month extension or name the trial in the programme that supplies it."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-07"
family = "DM"
severity = "S2"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["OBJECTIVES_AND_ESTIMANDS"]
check = "deterministic"
title = "HbA1c responder rate used as primary"
flag_if = "The primary endpoint is the share of participants reaching an HbA1c target (for example below 7%)."
fix = "Make change in HbA1c primary and report the responder rate as secondary."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-08"
family = "DM"
severity = "S3"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["ASSESSMENTS_AND_PROCEDURES"]
check = "deterministic"
title = "FPG not central or not in mg/dL"
flag_if = "Fasting plasma glucose is measured but not by a central laboratory, or not reported in mg/dL for a US submission."
fix = "Measure FPG centrally and report it in mg/dL (and mmol/L)."
source = "FDA draft guidance (non-binding): Diabetes Mellitus: Efficacy Endpoints (May 2023)"
source_tier = "draft_guidance"

[[rule]]
id = "DM-09"
family = "DM"
severity = "S2"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["OBJECTIVES_AND_ESTIMANDS", "TRIAL_DESIGN"]
check = "judgement"
title = "Short trial uses HbA1c as primary"
flag_if = "A trial shorter than 8 weeks uses HbA1c as its primary endpoint instead of glucose metrics or fructosamine."
fix = "Use glucose metrics or fructosamine as the primary endpoint in short trials."
source = "FDA draft guidance (non-binding): Diabetes Mellitus: Efficacy Endpoints (May 2023)"
source_tier = "draft_guidance"

[[rule]]
id = "DM-10"
family = "DM"
severity = "S2"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D", "INTERVENTION_IS_DRUG"]
needs_inputs = []
sections = ["TRIAL_DESIGN", "TRIAL_INTERVENTION"]
check = "judgement"
title = "Dose-ranging with too few doses or weeks"
flag_if = "A dose-ranging study tests fewer than 3 doses or treats for less than 8 weeks."
fix = "Test at least 3 doses for at least 8 weeks."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-16"
family = "DM"
severity = "S2"
detection = ["J", "C"]
applies_when = ["DIABETES_TYPE_T2D", "CONTROL_IS_ACTIVE"]
needs_inputs = []
sections = ["TRIAL_INTERVENTION", "INTRODUCTION"]
check = "judgement"
title = "Comparator is not current standard of care"
flag_if = "The active comparator does not reflect current standard of care for the population."
fix = "Choose a comparator in line with current ADA/EASD consensus and cite it."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-18"
family = "DM"
severity = "S2"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D", "IS_ADD_ON"]
needs_inputs = []
sections = ["TRIAL_INTERVENTION"]
check = "judgement"
title = "Background dose may change during maintenance"
flag_if = "Background glucose-lowering doses may be changed during the maintenance period for reasons other than safety."
fix = "Allow changes only for safety and record them as intercurrent events."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-19"
family = "DM"
severity = "S2"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D", "INTERVENTION_IS_DRUG"]
needs_inputs = []
sections = ["TRIAL_INTERVENTION", "TRIAL_POPULATION"]
check = "judgement"
title = "Washout of prior glucose-lowering drugs missing"
flag_if = "The protocol does not say how earlier glucose-lowering drugs are washed out, and the trial is not long enough to make washout unnecessary."
fix = "Add a washout period or justify why none is needed."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-22"
family = "DM"
severity = "S2"
detection = ["J"]
applies_when = ["DIABETES_TYPE_T2D"]
needs_inputs = []
sections = ["STATISTICAL_CONSIDERATIONS", "OBJECTIVES_AND_ESTIMANDS"]
check = "judgement"
title = "Rescue modelled only from non-rescued people"
flag_if = "A hypothetical strategy for rescue imputes outcomes using only participants who were never rescued."
fix = "Use reference-based (placebo) or retrieved-dropout imputation instead."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-24"
family = "DM"
severity = "S2"
detection = ["F"]
applies_when = ["DIABETES_TYPE_T2D", "IS_RANDOMIZED"]
needs_inputs = []
sections = ["TRIAL_INTERVENTION", "STATISTICAL_CONSIDERATIONS"]
check = "deterministic"
title = "No strata for baseline HbA1c or prior therapy"
flag_if = "Randomisation is not stratified by baseline HbA1c (for example 8% or less versus above 8%) or by prior therapy."
fix = "Stratify by baseline HbA1c and prior therapy."
source = "EMA CPMP/EWP/1080/00 Rev. 2"
source_tier = "final_guidance"

[[rule]]
id = "DM-25"
family = "DM"
severity = "S2"
detection = ["P"]
applies_when = ["DIABETES_TYPE_T2D"]
