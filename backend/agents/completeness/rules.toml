needs_inputs = []
sections = ["TRIAL_POPULATION", "TRIAL_DESIGN"]
check = "judgement"
title = "Exclusions block populations FDA wants studied"
flag_if = "Phase 3 exclusions shut out groups the programme must include (CKD stage 3-4, established cardiovascular disease, people over 65) without pointing to another trial that covers them."
fix = "Loosen these exclusions or name the trial in the programme that covers them."
source = "FDA draft guidance (non-binding): Type 2 Diabetes Mellitus: Evaluating the Safety of New Drugs (March 2020)"
source_tier = "draft_guidance"

[[rule]]
id = "DM-42"
