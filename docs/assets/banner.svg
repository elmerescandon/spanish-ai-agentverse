<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" fill="none" stroke-linecap="round" stroke-linejoin="round">
  <title>ProtocolAI: find protocol problems before the first patient is enrolled</title>
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="1"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="1" y="1" width="1198" height="338" rx="24"/>
    </clipPath>
  </defs>

  <rect x="1" y="1" width="1198" height="338" rx="24" fill="#ffffff"/>

  <!-- Insulin motif from the frontend icon, stretched across the right side -->
  <g clip-path="url(#card)" opacity="0.9">
    <path d="M700 150q25-50 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0" stroke="#059669" stroke-width="5"/>
    <path d="M750 230q25 50 50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0t50 0" stroke="#0284c7" stroke-width="5"/>
    <path d="M850 150V230M950 150V230M1050 150V230M1150 150V230" stroke="#d97706" stroke-width="2.5"/>
    <g fill="#d97706">
      <circle cx="850" cy="150" r="7"/><circle cx="950" cy="150" r="7"/>
      <circle cx="1050" cy="150" r="7"/><circle cx="1150" cy="150" r="7"/>
      <circle cx="850" cy="230" r="7"/><circle cx="950" cy="230" r="7"/>
      <circle cx="1050" cy="230" r="7"/><circle cx="1150" cy="230" r="7"/>
    </g>
    <rect x="690" y="0" width="260" height="340" fill="url(#fade)"/>
  </g>

  <!-- Logo: the frontend's insulin icon -->
  <g transform="translate(64 60) scale(2)">
    <rect width="32" height="32" rx="8" fill="#ecfdf5"/>
    <path d="M12 11V21M20 11V21" stroke="#d97706" stroke-width="1.6"/>
    <path d="M4 11q2-4 4 0t4 0t4 0t4 0t4 0t4 0" stroke="#059669" stroke-width="2.4"/>
    <path d="M8 21q2 4 4 0t4 0t4 0t4 0" stroke="#0284c7" stroke-width="2.4"/>
    <g fill="#d97706">
      <circle cx="12" cy="11" r="1.9"/><circle cx="20" cy="11" r="1.9"/>
      <circle cx="12" cy="21" r="1.9"/><circle cx="20" cy="21" r="1.9"/>
    </g>
  </g>
  <text x="146" y="111" font-family="'Libre Baskerville', Baskerville, Georgia, 'Times New Roman', serif" font-size="44" fill="#09090b" letter-spacing="-0.5">ProtocolAI</text>

  <text x="66" y="178" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="600" fill="#065f46" letter-spacing="2">MULTI-AGENT PROTOCOL REVIEW · TYPE 2 DIABETES</text>
  <text x="64" y="226" font-family="'Libre Baskerville', Baskerville, Georgia, 'Times New Roman', serif" font-size="30" fill="#18181b" letter-spacing="-0.3">Find protocol problems before</text>
  <text x="64" y="266" font-family="'Libre Baskerville', Baskerville, Georgia, 'Times New Roman', serif" font-size="30" fill="#18181b" letter-spacing="-0.3">the first patient is enrolled.</text>
  <text x="66" y="304" font-family="Inter, 'Helvetica Neue', Arial, sans-serif" font-size="16" fill="#52525b">Peer trials, guidelines and patient data in, doctor-approved changes out.</text>
  <rect x="1" y="1" width="1198" height="338" rx="24" stroke="#e4e4e7" stroke-width="2"/>
</svg>
