[project]
name = "spanish-ai-agentverse"
version = "0.1.0"
description = "Multi-agent system for the Agentverse UCL hackathon"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.115.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "uvicorn>=0.34.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "ruff>=0.17.4",
    "watchfiles>=1.3.0",
]

[tool.ruff]
# PEP 8 limit: ruff format wraps code to it, and E501 in ruff check flags
# what the formatter cannot wrap (long strings, comments, docstrings).
line-length = 79

[tool.ruff.lint]
extend-select = ["UP", "E501"]

[tool.pytest.ini_options]
markers = ["live: hits real APIs"]
addopts = "-m 'not live'"
pythonpath = ["."]
