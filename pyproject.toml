[project]
name = "spanish-ai-agentverse"
version = "0.1.0"
description = "Multi-agent system built on Fetch.ai uAgents for the Agentverse UCL hackathon"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "google-genai>=2.3.0",
    "pydantic-settings>=2.16.2",
    "pypdf>=7.0.0",
    "uagents==0.26.1",
]

[dependency-groups]
dev = [
    "fpdf2>=2.9.0",
    "mypy>=2.4.1",
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
    "watchfiles>=1.3.0",
]

[tool.ruff]
# PEP 8 limit: ruff format wraps code to it, and E501 in ruff check flags
# what the formatter cannot wrap (long strings, comments, docstrings).
line-length = 79

[tool.ruff.lint]
extend-select = ["UP", "E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["live: hits real APIs"]
addopts = "-m 'not live'"
pythonpath = ["."]

[[tool.mypy.overrides]]
module = ["uagents", "uagents.*"]
ignore_missing_imports = true
